<!DOCTYPE html>
<html lang="en">
  <title>Aaron's Game</title>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="angular.js"></script>
  <link href="bootstrap.css" rel="stylesheet" />
  <link href="bootstrap-theme.css" rel="stylesheet" />
  <script src="aaronsGameApp.js"></script>
  <script src="gridOperations.js"></script>
  <style>
  .cell-value {
    width: 25px;
  }
  </style>
</head>
<body ng-app="AaronsGameApp" ng-controller="defaultController" >
<div class="container-fluid panel panel-default">

  <div class="panel-heading">
    <h2 class="text-center text-capitalize">
    <label class="label label-success">{{solutions.length}} solutions</label>
    </h2>
  </div>

  <div class="panel-body">
  <h2>
    <div class="col-sm-3" style="display:inline-block" ng-repeat="grid in solutions">
      <table class="table-bordered" >
        <tr>
          <td>
            <span>
            <label class="cell-value text-center"></label>
            <label class="cell-value text-center">{{grid[0].cellValue}}</label>
            <label class="cell-value text-center">{{grid[1].cellValue}}</label>
            <label class="cell-value text-center"></label>
            </span>
          </td>
        </tr>
        <tr>
          <td>
            <span>
            <label class="cell-value text-center">{{grid[2].cellValue}}</label>
            <label class="cell-value text-center">{{grid[3].cellValue}}</label>
            <label class="cell-value text-center">{{grid[4].cellValue}}</label>
            <label class="cell-value text-center">{{grid[5].cellValue}}</label>
            </span>
          </td>
        </tr>
        <tr>
          <td>
            <span>
            <label class="cell-value text-center"></label>
            <label class="cell-value text-center">{{grid[6].cellValue}}</label>
            <label class="cell-value text-center">{{grid[7].cellValue}}</label>
            <label class="cell-value text-center"></label>
            </span>
          </td>
        </tr>
      </table>
      <p></p>
    </div>
    </h2>
  </div>

  <div class="panel-footer">
    <h2 class="text-center text-capitalize">
    <label class="label label-warning">{{attempts}} total attempts </label>
    </h2>
  </div>
</div>
<div class="col-sm-9">
</div>
<div class="col-sm-3">
  <h4>
    <button class="btn btn-default pull-right" onclick="window.history.back();">
      Back to your cell
    </button>
  </h4>
</div>
</body>
</html>
